<!--
  Template Vorynt — lead do formulário de contato

  Como adicionar no Resend:
  1. Dashboard → Templates → New Template
  2. Cole este HTML (modo HTML / código)
  3. Declare as variáveis abaixo como string (sem fallback, ou fallback "—"):
     LEAD_NAME, LEAD_EMAIL, LEAD_COMPANY, PROJECT_TYPE, LOCALE, MESSAGE
     (não use EMAIL — nome reservado pelo Resend)
  4. Publique o template e defina o alias: contact-lead
  5. Confira RESEND_CONTACT_TEMPLATE_ID=contact-lead no .env

  Variáveis: {{{LEAD_NAME}}} {{{LEAD_EMAIL}}} {{{LEAD_COMPANY}}}
             {{{PROJECT_TYPE}}} {{{LOCALE}}} {{{MESSAGE}}}
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Novo lead — Vorynt</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0d1420;
      color: #e8eef6;
      font-family:
        Segoe UI,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-text-size-adjust: 100%;
    ">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #0d1420">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 560px">
            <tr>
              <td
                style="
                  padding-bottom: 20px;
                  font-size: 11px;
                  letter-spacing: 0.28em;
                  text-transform: uppercase;
                  color: #c5e0f5;
                  font-weight: 600;
                ">
                Vorynt
              </td>
            </tr>
            <tr>
              <td
                style="
                  background-color: #121a28;
                  border: 1px solid rgba(165, 196, 232, 0.18);
                  border-radius: 16px;
                  overflow: hidden;
                ">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0">
                  <tr>
                    <td
                      style="
                        height: 3px;
                        line-height: 3px;
                        font-size: 0;
                        background: linear-gradient(
                          90deg,
                          #4a9dff 0%,
                          #c5e0f5 50%,
                          #4a9dff 100%
                        );
                      ">
                      &nbsp;
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 28px 28px 8px">
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 11px;
                          letter-spacing: 0.24em;
                          text-transform: uppercase;
                          color: #c5e0f5;
                        ">
                        Novo contato
                      </p>
                      <h1
                        style="
                          margin: 0;
                          font-size: 22px;
                          line-height: 1.3;
                          font-weight: 600;
                          color: #f4f7fb;
                        ">
                        {{{LEAD_NAME}}}
                      </h1>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 20px 28px 8px">
                      <table
                        role="presentation"
                        width="100%"
                        cellpadding="0"
                        cellspacing="0"
                        border="0">
                        <tr>
                          <td
                            style="
                              padding: 10px 0;
                              border-bottom: 1px solid rgba(165, 196, 232, 0.12);
                            ">
                            <p
                              style="
                                margin: 0 0 4px;
                                font-size: 11px;
                                letter-spacing: 0.16em;
                                text-transform: uppercase;
                                color: #8fa3b8;
                              ">
                              E-mail
                            </p>
                            <p style="margin: 0; font-size: 15px">
                              <a
                                href="mailto:{{{LEAD_EMAIL}}}"
                                style="color: #7eb6ff; text-decoration: none"
                                >{{{LEAD_EMAIL}}}</a
                              >
                            </p>
                          </td>
                        </tr>
                        <tr>
                          <td
                            style="
                              padding: 10px 0;
                              border-bottom: 1px solid rgba(165, 196, 232, 0.12);
                            ">
                            <p
                              style="
                                margin: 0 0 4px;
                                font-size: 11px;
                                letter-spacing: 0.16em;
                                text-transform: uppercase;
                                color: #8fa3b8;
                              ">
                              Empresa
                            </p>
                            <p
                              style="
                                margin: 0;
                                font-size: 15px;
                                color: #e8eef6;
                              ">
                              {{{LEAD_COMPANY}}}
                            </p>
                          </td>
                        </tr>
                        <tr>
                          <td
                            style="
                              padding: 10px 0;
                              border-bottom: 1px solid rgba(165, 196, 232, 0.12);
                            ">
                            <p
                              style="
                                margin: 0 0 4px;
                                font-size: 11px;
                                letter-spacing: 0.16em;
                                text-transform: uppercase;
                                color: #8fa3b8;
                              ">
                              Tipo de projeto
                            </p>
                            <p
                              style="
                                margin: 0;
                                font-size: 15px;
                                color: #e8eef6;
                              ">
                              {{{PROJECT_TYPE}}}
                            </p>
                          </td>
                        </tr>
                        <tr>
                          <td
                            style="
                              padding: 10px 0;
                              border-bottom: 1px solid rgba(165, 196, 232, 0.12);
                            ">
                            <p
                              style="
                                margin: 0 0 4px;
                                font-size: 11px;
                                letter-spacing: 0.16em;
                                text-transform: uppercase;
                                color: #8fa3b8;
                              ">
                              Idioma
                            </p>
                            <p
                              style="
                                margin: 0;
                                font-size: 15px;
                                color: #e8eef6;
                              ">
                              {{{LOCALE}}}
                            </p>
                          </td>
                        </tr>
                        <tr>
                          <td style="padding: 16px 0 8px">
                            <p
                              style="
                                margin: 0 0 8px;
                                font-size: 11px;
                                letter-spacing: 0.16em;
                                text-transform: uppercase;
                                color: #8fa3b8;
                              ">
                              Mensagem
                            </p>
                            <p
                              style="
                                margin: 0;
                                font-size: 15px;
                                line-height: 1.6;
                                color: #e8eef6;
                              ">
                              {{{MESSAGE}}}
                            </p>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding: 16px 28px 28px">
                      <a
                        href="mailto:{{{LEAD_EMAIL}}}"
                        style="
                          display: inline-block;
                          background-color: #4a9dff;
                          color: #0d1420;
                          font-size: 14px;
                          font-weight: 600;
                          text-decoration: none;
                          padding: 12px 22px;
                          border-radius: 999px;
                        "
                        >Responder</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 20px;
                  font-size: 12px;
                  color: #6b7c90;
                  line-height: 1.5;
                ">
                Enviado pelo formulário do site Vorynt.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
